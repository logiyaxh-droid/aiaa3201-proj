[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aiaa3201-vsr"
version = "1.0.0"
description = "When Do Generative Priors Help Video Super-Resolution? A Systematic Benchmark and Pixel-Space Real-World Fine-Tuning Study"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
    "opencv-python-headless>=4.9.0",
    "Pillow>=10.0.0",
    "PyYAML>=6.0",
    "lpips>=0.1.4",
    "pytorch-fid>=0.3.0",
    "scikit-image>=0.22.0",
    "matplotlib>=3.8.0",
    "tqdm>=4.66.0",
    "imageio>=2.34.0",
    "imageio-ffmpeg>=0.5.0",
]

[project.optional-dependencies]
iqa = [
    "pyiqa>=0.1.12",
    "DISTS-pytorch>=0.1",
]
priors = [
    "diffusers>=0.32.0",
    "transformers>=4.46.0",
    "accelerate>=1.0.0",
    "safetensors>=0.4.5",
    "peft>=0.13.0",
]

[tool.setuptools.packages.find]
include = ["evalkit*", "models*"]
